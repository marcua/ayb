<!DOCTYPE html>
<html
  lang="en"
  class="uk-theme-blue uk-radii-md uk-shadows-md uk-font-sm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if redirect %}
    <meta http-equiv="refresh" content="0; url={{ redirect }}" />
    {% endif %}
    <title>{% block title %}{{ title }}{% endblock %} - ayb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      :root {
          font-family: "Geist";
          font-optical-sizing: auto;
          font-style: normal;
          --color-overlay: rgba(255, 255, 255, 0.7);
      }

      .bg-overlay {
          background: var(--color-overlay);
      }
    </style>

    <link rel="stylesheet" href="/static/franken-ui-2.0.0/core.min.css" />
    <link rel="stylesheet" href="/static/franken-ui-2.0.0/utilities.min.css" />
    <script src="/static/franken-ui-2.0.0-internal.42/core.iife.js" type="module"></script>
    <script src="/static/franken-ui-2.0.0-internal.42/icon.iife.js" type="module"></script>
    <!-- TODO(marcua): Can we only include it where necessary, like on the database page? -->
    <script src="/static/htmx-2.0.4/htmx.min.js"></script>
    <script src="/static/htmx-ext-response-targets-2.0.3/response-targets.min.js"></script>
</head>
<body class="bg-background text-foreground" hx-ext="response-targets">
    {% block content %}{% endblock %}
</body>
</html>
